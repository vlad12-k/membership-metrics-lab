membership_metrics_lab:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('MML_DB_HOST', '127.0.0.1') }}"
      port: "{{ env_var('MML_DB_PORT', '54329') | as_number }}"
      user: "{{ env_var('MML_DB_USER', 'membership_metrics') }}"
      pass: "{{ env_var('MML_DB_PASSWORD') }}"
      dbname: "{{ env_var('MML_DB_NAME', 'membership_metrics') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
      retries: 1
