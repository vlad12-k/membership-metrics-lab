[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "membership-metrics-lab"
version = "0.1.0"
description = "Synthetic membership analytics engineering portfolio case study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-postgres==1.11.0",
]

[project.scripts]
membership-metrics-generate = "membership_metrics.generate:main"
membership-metrics-validate = "membership_metrics.validate:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
